<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>INIA Cuyes</title>
  <script>
    // Solución Single Page App (SPA) para GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    
    // Este script verifica si una redirección es necesaria y la realiza
    (function() {
      var segmentCount = 1; // Ajusta esto según la profundidad de tu repositorio
      var l = window.location;
      var repo = "iniaCuyes"; // Nombre de tu repositorio
      
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    })();
  </script>
</head>
